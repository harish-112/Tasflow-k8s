apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: taskflowregistry.azurecr.io/worker:v1
          envFrom:
            - configMapRef:
                name: taskflow-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"