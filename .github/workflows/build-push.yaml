name: Build and Push to ACR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push task-service
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/task-service:${{ github.sha }} ./task-service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/task-service:${{ github.sha }}

      - name: Build and push api-gateway
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:${{ github.sha }} ./api-gateway
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:${{ github.sha }}

      - name: Build and push worker
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/worker:${{ github.sha }} ./worker
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/worker:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
  deploy:
      runs-on: ubuntu-latest
      needs: build-and-push 
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
  
        - name: Log in to Azure
          uses: azure/login@v1
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}
  
        - name: Get AKS credentials
          run: |
            az aks get-credentials \
              --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
              --name ${{ secrets.AKS_CLUSTER_NAME }} \
              --overwrite-existing
  
        - name: Deploy task-service
          run: |
            kubectl set image deployment/task-service \
              task-service=${{ secrets.ACR_LOGIN_SERVER }}/task-service:${{ github.sha }} \
              -n taskflow
  
        - name: Deploy api-gateway
          run: |
            kubectl set image deployment/api-gateway \
              api-gateway=${{ secrets.ACR_LOGIN_SERVER }}/api-gateway:${{ github.sha }} \
              -n taskflow
  
        - name: Deploy worker
          run: |
            kubectl set image deployment/worker \
              worker=${{ secrets.ACR_LOGIN_SERVER }}/worker:${{ github.sha }} \
              -n taskflow
  
        - name: Deploy frontend
          run: |
            kubectl set image deployment/frontend \
              frontend=${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
              -n taskflow
  
        - name: Verify rollout
          run: |
            kubectl rollout status deployment/task-service -n taskflow
            kubectl rollout status deployment/api-gateway -n taskflow
            kubectl rollout status deployment/worker -n taskflow
            kubectl rollout status deployment/frontend -n taskflow
